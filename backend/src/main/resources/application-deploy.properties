# Ticket 035: perfil activado SOLO por los contenedores que levantan
# deploy/docker-compose.{dev,qa,prod}.yml en la VM
# (SPRING_PROFILES_ACTIVE=deploy) -- nunca en local ni en tests. Mismo
# patrón exacto que auth-core-mc (ticket 049).
#
# Por qué existe: hoy la única forma en que este backend encuentra su
# Postgres es `spring-boot-docker-compose` (ver build.gradle),
# `developmentOnly` -- Spring Boot lo excluye automáticamente del jar
# empaquetado (bootJar), así que el jar que corre dentro del contenedor
# Docker NO tiene ninguna otra forma de saber dónde está su base de
# datos. Sin este perfil, la app crashearía al arrancar en cualquier
# despliegue real. Vive en un perfil aparte (no en application.properties)
# para no tocar en absoluto el comportamiento de `bootRun`/tests locales.
#
# DB_PASSWORD deliberadamente SIN default -- si falta, Spring falla fuerte
# al resolver el placeholder en vez de arrancar con una contraseña vacía
# (misma filosofía que ClaudeProvider: fallar ruidoso, no en silencio).
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:galgoth_studio}
spring.datasource.username=${DB_USER:galgoth_studio}
spring.datasource.password=${DB_PASSWORD}

# Hallazgo real post-despliegue (Marco navegando la app real, POST
# /api/projects -> 403): Spring aplica su filtro CORS a CUALQUIER
# request con cabecera Origin presente, sin importar si coincide con el
# propio host -- ver WebConfig para el detalle completo. Los 3
# subdominios reales, uno por ambiente -- se declaran los 3 en los 3
# ambientes (no solo el propio) porque no cuesta nada tenerlos de más:
# el navegador solo manda el Origin del dominio desde el que realmente
# se cargó la página, así que un backend de DEV nunca va a recibir de
# verdad "Origin: https://studio.galgoth..." salvo que alguien lo fuerce
# a mano.
galgoth.cors.allowed-origins=${GALGOTH_CORS_ALLOWED_ORIGINS:https://studio.galgoth.64bitstudio.com,https://studio-qa.galgoth.64bitstudio.com,https://studio-dev.galgoth.64bitstudio.com}

# Ticket 072: a diferencia de CORS arriba, este SÍ es distinto por
# ambiente real (auth.64bitstudio.com/auth-qa/auth-dev) -- cada
# deploy/docker-compose.{dev,qa,prod}.yml fija su propio
# AUTH_CORE_MC_ISSUER con el default correcto de ese ambiente
# (mismo patrón que APP_BASE_URL en auth-core-mc). Deliberadamente sin
# default aquí -- si algún ambiente se queda sin fijarlo, Spring falla
# fuerte al resolver el placeholder en vez de validar tokens contra un
# emisor equivocado en silencio.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_CORE_MC_ISSUER}
