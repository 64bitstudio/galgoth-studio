spring.application.name=GalgothStudio

# Dev local: spring-boot-docker-compose (developmentOnly, ver build.gradle)
# detecta el servicio "postgres" en ../docker/docker-compose.yml y
# autoconfigura spring.datasource.* -- no hace falta declararlo aquí.
# El jar empaquetado (bootJar) NO incluye esta dependencia, así que en
# contenedor real hace falta un profile "deploy" con datasource explícito
# (mismo patrón que auth-core-mc) -- todavía no existe, se agrega cuando
# el Dockerfile/deploy real del backend aterrice (fuera del alcance del
# ticket 003, ver docs/definiciones/galgoth-studio-mvp.md).
spring.docker.compose.file=../docker/docker-compose.yml

# Ticket 023: MinIO local (docker/docker-compose.yml) -- sin connector de
# spring-boot-docker-compose para S3 (a diferencia de Postgres), así que
# el endpoint/credenciales se configuran a mano contra el puerto fijo del
# compose (9000, confirmado libre en esta Mac). En un deploy real, estas
# tres claves se sobrescriben vía variables de entorno (mismo patrón que
# el resto del proyecto), nunca hardcodeadas fuera de dev local.
galgoth.storage.minio.endpoint=http://localhost:9000
galgoth.storage.minio.access-key=galgoth_studio
galgoth.storage.minio.secret-key=galgoth_studio_dev_minio
galgoth.storage.minio.bucket=galgoth-studio-assets
