spring.application.name=GalgothStudio

# Ticket 035: origen(es) permitido(s) para CORS de /api/** (WebConfig) --
# lista separada por comas, relaxed binding a array (mismo patrón que el
# resto del proyecto). Default: los puertos de Vite en dev local.
# application-deploy.properties sobreescribe con los 3 subdominios reales
# -- ver el comentario de WebConfig para el hallazgo real completo
# (Spring aplica CORS a CUALQUIER request con cabecera Origin, sin
# importar si coincide con el propio host, así que hasta un POST
# same-origin necesita estar en esta lista).
galgoth.cors.allowed-origins=${GALGOTH_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Dev local: spring-boot-docker-compose (developmentOnly, ver build.gradle)
# detecta el servicio "postgres" en ../docker/docker-compose.yml y
# autoconfigura spring.datasource.* -- no hace falta declararlo aquí.
# El jar empaquetado (bootJar) NO incluye esta dependencia, así que en
# contenedor real hace falta un profile "deploy" con datasource explícito
# (mismo patrón que auth-core-mc) -- ver application-deploy.properties
# (ticket 035, activado por SPRING_PROFILES_ACTIVE=deploy en
# deploy/docker-compose.*.yml).
spring.docker.compose.file=../docker/docker-compose.yml

# Ticket 023: MinIO local (docker/docker-compose.yml) -- sin connector de
# spring-boot-docker-compose para S3 (a diferencia de Postgres), así que
# el endpoint/credenciales se configuran a mano. Default: el puerto fijo
# del compose (9000, confirmado libre en esta Mac) -- pero NO en un
# agente de CI compartido, donde otro job puede tenerlo ya ocupado
# (hallazgo real, ticket 033: `docker compose up` falló en Jenkins,
# "port is already allocated"). `GALGOTH_STORAGE_MINIO_ENDPOINT` (relaxed
# binding, mismo patrón que AI_VISION_PROVIDER/etc.) permite sobrescribirlo
# -- `scripts/e2e.sh` lo hace, descubriendo el puerto real que Docker
# asignó en ese momento.
#
# Ticket 035: access-key/secret-key/bucket ganan el mismo tratamiento de
# override por env var que endpoint ya tenía -- hallazgo real al preparar
# el despliegue: hasta este ticket estaban hardcodeados a las credenciales
# de desarrollo local ("galgoth_studio_dev_minio"), que nunca deben ser
# las credenciales reales de MinIO en la VM. Los defaults siguen siendo
# los mismos literales de siempre (dev local no cambia).
galgoth.storage.minio.endpoint=${GALGOTH_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
galgoth.storage.minio.access-key=${GALGOTH_STORAGE_MINIO_ACCESS_KEY:galgoth_studio}
galgoth.storage.minio.secret-key=${GALGOTH_STORAGE_MINIO_SECRET_KEY:galgoth_studio_dev_minio}
galgoth.storage.minio.bucket=${GALGOTH_STORAGE_MINIO_BUCKET:galgoth-studio-assets}

# Ticket 025: proveedores de IA (master prompt §20) -- "claude" es el
# default/activo (AC del ticket); "mock" se usa en tests/desarrollo sin
# key real (AiProviderConfig selecciona el bean por esta propiedad, sin
# que ai-orchestrator ni el dominio se enteren de cuál está activo).
# Relaxed binding de Spring mapea las env vars AI_VISION_PROVIDER/
# AI_REASONING_PROVIDER a estas dos claves automáticamente.
ai.vision-provider=claude
ai.reasoning-provider=claude
# ANTHROPIC_API_KEY se inyecta por variable de entorno -- nunca hardcodeada
# (ver docker/.env.example). ClaudeProvider falla explícito si está vacía
# y de verdad se lo llama (nunca silencioso).
ai.claude.api-key=${ANTHROPIC_API_KEY:}
ai.claude.model=claude-sonnet-5
ai.claude.base-url=https://api.anthropic.com

# Ticket 038: la llamada al Geometry Planner (razonamiento) tarda 70-90s
# reales contra Claude -- hallazgo real vía `ai_job_events` de 2 jobs
# reales en dev (2026-09-09), causa confirmada del reporte "progreso
# pegado en 0%". Con streaming=true, MobGenerationService consume la
# respuesta incrementalmente y emite cada operación real a medida que el
# modelo la termina, en vez de esperar el bloque completo. Switch
# operativo manual (no fallback automático por request fallido, para no
# enmascarar fallas reales): si el streaming empieza a fallar mucho en
# producción, se apaga con esta env var + redeploy y el pipeline cae al
# modo heartbeat (la misma llamada bloqueante de siempre, con un ping
# periódico honesto -- mismo stage/% real, solo el mensaje cambia).
ai.geometry-streaming-enabled=${AI_GEOMETRY_STREAMING_ENABLED:true}
# Cadencia del ping de "sigue vivo" en modo heartbeat (switch apagado) --
# no expuesto como env var propia por ahora (ningún operador necesitó
# tocarlo todavía), pero configurable vía @Value con default explícito
# para que los tests puedan acelerarlo sin esperar 8s reales.
ai.geometry-heartbeat-initial-delay-seconds=8
ai.geometry-heartbeat-period-seconds=8
