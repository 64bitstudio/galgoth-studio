# Desarrollo local — Galgoth Studio Technical Alpha.
#
# Postgres (ticket 003) + MinIO (ticket 023 -- adelantado desde el 024
# original por decisión explícita del Product Owner: el pipeline de
# thumbnails necesita subir el PNG generado como asset YA, y esperar al
# asset-service genérico de imágenes de referencia habría bloqueado este
# ticket sin necesidad real -- el documento de definición
# (docs/definiciones/galgoth-studio-mvp.md, Diseño técnico §1) ya
# nombraba MinIO en el docker-compose final, esto no es una decisión de
# arquitectura nueva, solo adelantar CUÁNDO se levanta).
#
# backend/src/main/resources/application.properties apunta aquí
# (spring.docker.compose.file=../docker/docker-compose.yml) -- Spring Boot
# (spring-boot-docker-compose, developmentOnly) detecta el servicio
# "postgres" por su imagen y autoconfigura spring.datasource.* solo.
# MinIO NO tiene un connector de spring-boot-docker-compose (a diferencia
# de Postgres) -- sus credenciales/endpoint se configuran a mano en
# application.properties, apuntando al puerto fijo de abajo (9000/9001
# confirmados libres en esta Mac, a diferencia de 5432/5433).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: galgoth_studio
      POSTGRES_USER: galgoth_studio
      POSTGRES_PASSWORD: galgoth_studio_dev
    ports:
      # Puerto de host aleatorio (no 5432 fijo): en esta Mac ya hay otros
      # proyectos ocupando 5432 Y 5433 -- spring-boot-docker-compose (ver
      # application.properties) resuelve el puerto real automáticamente
      # inspeccionando el contenedor, así que no depende de un puerto fijo.
      # Para psql manual: `docker compose port postgres 5432`.
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galgoth_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: galgoth_studio
      MINIO_ROOT_PASSWORD: galgoth_studio_dev_minio
    ports:
      # Puerto de host fijo por default (9000/9001, confirmados libres en
      # esta Mac) -- application.properties apunta ahí sin nada más que
      # hacer para el flujo local de siempre. Overrideable con
      # MINIO_HOST_PORT/MINIO_CONSOLE_HOST_PORT (mismo patrón relaxed-binding
      # del resto del proyecto) -- hallazgo real, ticket 033: en un agente
      # de CI compartido 9000 puede estar ya ocupado por otro job; ahí
      # `scripts/e2e.sh` pasa `MINIO_HOST_PORT=0` (Docker asigna uno libre)
      # y descubre el puerto real asignado antes de levantar el backend.
      - "${MINIO_HOST_PORT:-9000}:9000" # API S3-compatible
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001" # Consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
