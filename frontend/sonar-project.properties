# S6819 (ticket 058, GSelect.vue): excepción deliberada y documentada,
# no un parche silencioso -- GSelect.vue es el select-con-valor propio
# del design system, requerido explícitamente por el VoBo del PO (ningún
# <select> nativo en la pantalla de Textura, para poder estilizar la
# opción activa/check/hover consistentes con el resto del toolbar).
# role="listbox" + role="option" es el patrón WAI-ARIA "Select-Only
# Combobox" recomendado precisamente para este caso -- no existe un
# <select>/<option> nativo que permita esa personalización visual
# cross-browser. Se excluyen los 3 repos posibles (Web/javascript/
# typescript) porque el análisis de .vue no deja claro cuál lo reporta.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e1.resourceKey=**/GSelect.vue
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S6819
sonar.issue.ignore.multicriteria.e2.resourceKey=**/GSelect.vue
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e3.resourceKey=**/GSelect.vue

# S6819 (ticket 067, TextureAiGeneratorScreen.vue): misma excepción
# deliberada y documentada que GSelect.vue arriba -- VoBo explícito del PO
# sobre el preview publicado (https://claude.ai/code/artifact/9efe4c8d-2776-4f94-be58-6caa4fb78ebc,
# "integralo exactamente como esta") de reemplazar TODO <input
# type="radio"> nativo de Estilo/Detalle por tarjetas/segmentos con
# role="radio". role="radiogroup"/role="radio" es el patrón WAI-ARIA
# "Radio Group" recomendado precisamente para este caso -- un <input
# type="radio"> nativo no permite el ícono/tarjeta/segmento visual que
# pide el rediseño. Mismos 3 repos posibles que la excepción de GSelect.
sonar.issue.ignore.multicriteria.e4.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e4.resourceKey=**/TextureAiGeneratorScreen.vue
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S6819
sonar.issue.ignore.multicriteria.e5.resourceKey=**/TextureAiGeneratorScreen.vue
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S6819
