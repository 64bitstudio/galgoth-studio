# S6819 (ticket 068, TextureCanvas.vue): excepción deliberada y
# documentada, mismo criterio de arriba -- el separador arrastrable entre
# el lienzo y el preview 3D usa role="separator" (patrón WAI-ARIA
# "Separator/Window Splitter" de la APG, con aria-valuenow/min/max +
# soporte de teclado, ver `handleSplitterKeydown`) porque no existe un
# <hr> (la sugerencia real de Sonar) que sea arrastrable/enfocable/
# redimensionable -- <hr> es un elemento estático de separación visual,
# nunca un widget interactivo. Mismos 3 repos posibles que las excepciones
# de arriba.
