# S6845 (ticket 068, TextureCanvas.vue): excepción deliberada y
# documentada -- misma regla "static analysis blind spot" que S6819
# arriba, pero para tabindex en vez del rol en sí. El separador
# arrastrable es un <div>, que la regla considera "no interactivo" por
# tipo de elemento, sin tener en cuenta que `role="separator"` +
# `aria-valuenow` (ya presentes, ver arriba) son EXACTAMENTE lo que la
# spec WAI-ARIA exige para que un separador pase de decorativo a widget
# real -- en ese caso `tabindex` es obligatorio, no un error. No existe
# un elemento nativo interactivo que sirva de separador/splitter
# arrastrable (por eso la excepción de S6819 de arriba, sobre el mismo
# elemento). Mismos 3 repos posibles que el resto de las excepciones.
sonar.issue.ignore.multicriteria.e10.ruleKey=Web:S6845
