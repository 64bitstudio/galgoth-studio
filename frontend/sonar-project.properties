# S7785 (ticket 069, TextureAiGeneratorPanel.vue): excepción deliberada y
# documentada -- Sonar sugiere `await loadReferenceImages()` a nivel de
# módulo en vez de `void loadReferenceImages()`, pero este archivo es un
# <script setup> de Vue: un `await` de verdad a nivel de top-level ahí
# vuelve el componente async (`async setup()`), lo que exige que el
# padre lo envuelva en <Suspense> (MobEditor.vue no lo hace, y no se
# quiere -- bloquearía el render inicial del drawer entero hasta que
# resuelva el fetch de la imagen de referencia, en vez de mostrar el
# formulario de inmediato y completar la referencia cuando llegue, mismo
# criterio de UI ya usado en `AiEditPanel.vue`). El análisis estático no
# tiene en cuenta esta semántica especial de Vue -- mismo tipo de "blind
# spot" que las excepciones de arriba. Mismos 3 repos posibles.
sonar.issue.ignore.multicriteria.e13.ruleKey=Web:S7785
sonar.issue.ignore.multicriteria.e13.resourceKey=**/TextureAiGeneratorPanel.vue
sonar.issue.ignore.multicriteria.e14.ruleKey=javascript:S7785
