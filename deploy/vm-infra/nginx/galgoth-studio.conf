# Ticket 035: vhost de nginx para los 3 subdominios de galgoth-studio.
# Mismo patrón exacto que auth-core-mc/mail-core-mc/texture-studio-mc
# (nginx de fábrica en 80/443, Traefik puertas adentro en
# 127.0.0.1:8000) -- ver docs/ARQUITECTURA.md de auth-core-mc, ticket
# 049, para el porqué completo de esta topología.
#
# Subdominio de tercer nivel (confirmado por el PO, ticket 035):
# studio[.-qa][-dev].galgoth.64bitstudio.com -- no el patrón plano
# <slug>[.-qa][-dev].64bitstudio.com de los 3 cores anteriores.
#
# Solo HTTP por ahora (puerto 80) -- SIN bloque 443/ssl todavía: lo
# agrega `certbot --nginx` en el primer deploy real a `dev`
# (corePipeline.groovy, `certbotDomains` del Jenkinsfile) -- no hace
# falta volver a tocar este archivo a mano para eso.
#
# nginx reenvía TODO (incluida cualquier ruta /.well-known/acme-challenge/
# que certbot necesite) al Traefik interno -- Traefik nunca es alcanzable
# desde fuera de esta VM directamente.
#
# Hallazgo real (Marco navegando el wizard real, "Generar con IA" ->
# 413 Payload Too Large al subir carcomido_reference.png, 3.09MB):
# `MobReferenceImageController.upload` (024) acepta hasta 10MB de
# verdad (`ReferenceImageService.MAX_SIZE_BYTES`, body crudo vía
# `@RequestBody byte[]`, sin multipart -- los límites de multipart de
# Spring nunca aplican acá) -- pero nginx nunca tuvo su propio límite
# configurado, así que corría con el default de fábrica
# (`client_max_body_size 1m`), rechazando CUALQUIER imagen real de más
# de 1MB antes de que la request llegara siquiera a Traefik/Spring.
# Nunca reproducido en desarrollo local (sin nginx de por medio ahí).
# 12m (headroom sobre el límite real de 10MB de la app).
#
# Hallazgo real #2 (ticket 038, verificación en vivo contra Claude real,
# job cb867de9, 2026-09-10): el stream SSE de `GET /api/jobs/{jobId}/events`
# quedó en silencio ~75s real (Claude en razonamiento extendido antes de
# emitir el primer token) -- tiempo suficiente para pasar el
# `proxy_read_timeout` default de nginx (60s), que nunca se había
# configurado para este vhost. nginx cortó la conexión upstream a mitad
# de una generación real; el cliente (`EventSource`) reconectó solo y la
# generación terminó bien igual (backlog completo desde seq=1), pero
# depender de la reconexión para algo que puede pasar en CADA generación
# real es frágil -- 300s da margen real de sobra para una generación
# completa (~90s observados) sin nunca necesitar cortar la conexión.
server {
    listen 80;
    listen [::]:80;
    server_name studio.galgoth.64bitstudio.com studio-qa.galgoth.64bitstudio.com studio-dev.galgoth.64bitstudio.com;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }
}
