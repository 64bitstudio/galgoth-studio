# Ticket 035: stack QA en la VM -- mismo patrón que
# auth-core-mc/mail-core-mc/texture-studio-mc, adaptado a este backend
# (Spring Boot + Postgres + MinIO, sin Redis/Vault -- este proyecto no
# usa ninguno de los dos).
#
# "Bajo demanda" -- igual que el resto de los cores (VM de capa gratuita,
# compartida). deploy/env-ctl.sh de auth-core-mc es el mismo mecanismo
# reusable si se necesita acá -- no incluido en este ticket por no
# aportar nada nuevo, se copia igual si hace falta.
#
# Puertos de host reservados por galgoth-studio (coordinado con
# auth-core-mc 8080-8082, mail-core-mc 8083-8085, texture-studio-mc
# 8086-8088 -- ver auth-core-mc/docs/ARQUITECTURA.md, "Convenciones de la
# VM"): PROD 8089 / DEV 8091 / QA 8092 (este archivo) -- NO 8090:
# hallazgo real en el primer deploy a DEV, "port is already allocated"
# -- Jenkins mismo publica su UI en 127.0.0.1:8090, un puerto que la
# tabla de "Convenciones de la VM" nunca documentó (solo documentaba los
# puertos de los 3 cores anteriores, no los de la infra compartida
# misma) -- corregido también en esa tabla, ver su propio historial.
#
# GALGOTH_STORAGE_MINIO_ACCESS_KEY/SECRET_KEY reusan directamente
# MINIO_ROOT_USER/MINIO_ROOT_PASSWORD (mismo criterio que
# docker/docker-compose.yml de desarrollo local) -- un solo par de
# credenciales que administrar por ambiente, no dos.
name: galgoth-studio-qa

services:
  app:
    image: galgoth-studio-qa:${IMAGE_TAG:?falta IMAGE_TAG (sha del commit a desplegar)}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: deploy
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: galgoth_studio
      DB_USER: galgoth_studio
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en deploy/.env.qa}
      GALGOTH_STORAGE_MINIO_ENDPOINT: http://minio:9000
      GALGOTH_STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en deploy/.env.qa}
      GALGOTH_STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en deploy/.env.qa}
      GALGOTH_STORAGE_MINIO_BUCKET: galgoth-studio-assets
      # Decisión explícita del PO (ticket 035): Claude real en los 3
      # ambientes, no el provider mock -- implica gasto real de la cuenta
      # de Anthropic en cualquier generación/edición que se dispare
      # contra este QA.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?falta ANTHROPIC_API_KEY en deploy/.env.qa}
      # Ticket 059 -- hallazgo real: el proveedor de generación de imagen
      # está fijo en "openai" (ai.image-provider, application.properties),
      # una cuenta DISTINTA a la de ANTHROPIC_API_KEY de arriba (esa cubre
      # análisis de paleta/mapeo de caras vía Claude, no la generación de
      # imagen en sí) -- sin esta key la etapa "generando_textura" del
      # pipeline de IA de textura falla siempre, en cualquier mob.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?falta OPENAI_API_KEY en deploy/.env.qa}
    ports:
      - "8092:8080"
    networks:
      - default
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # Ingress compartido de la VM (Traefik) -- enruta
    # studio-qa.galgoth.64bitstudio.com hacia este contenedor. El puerto
    # de host (8092) sigue publicado además, sin Traefik de por medio,
    # porque el propio pipeline (healthcheck del job deploy-qa) le pega
    # directo al contenedor por nombre (ver corePipeline.groovy).
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.galgoth-studio-qa.rule=Host(`studio-qa.galgoth.64bitstudio.com`)"
      - "traefik.http.routers.galgoth-studio-qa.entrypoints=web"
      - "traefik.http.services.galgoth-studio-qa.loadbalancer.server.port=8080"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: galgoth_studio
      POSTGRES_USER: galgoth_studio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en deploy/.env.qa}
    volumes:
      - galgoth_studio_qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galgoth_studio -d galgoth_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en deploy/.env.qa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en deploy/.env.qa}
    volumes:
      - galgoth_studio_qa_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edge:
    external: true

volumes:
  galgoth_studio_qa_pgdata:
  galgoth_studio_qa_miniodata:
